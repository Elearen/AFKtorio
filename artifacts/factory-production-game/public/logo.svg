  <defs>
    <clipPath id="left-half"><rect x="0" y="0" width="90" height="180" /></clipPath>
    <clipPath id="right-half"><rect x="90" y="0" width="90" height="180" /></clipPath>
  </defs>
  <rect x="3" y="3" width="174" height="174" rx="38" fill="#151A1D" stroke="#3B474B" stroke-width="6" />
  <rect x="12" y="12" width="156" height="156" rx="30" fill="#20282B" />

  <g clip-path="url(#left-half)">
    <g fill="#F28A24" stroke="#FFB24D" stroke-width="1.5">
      <circle cx="90" cy="90" r="48" />
      <rect x="82" y="13" width="16" height="29" rx="4" />
      <rect x="82" y="138" width="16" height="29" rx="4" />
      <rect x="13" y="82" width="29" height="16" rx="4" />
      <rect x="138" y="82" width="29" height="16" rx="4" />
      <rect x="28" y="28" width="17" height="29" rx="4" transform="rotate(-45 28 28)" />
      <rect x="135" y="135" width="17" height="29" rx="4" transform="rotate(-45 135 135)" />
      <rect x="123" y="28" width="17" height="29" rx="4" transform="rotate(45 123 28)" />
      <rect x="16" y="135" width="17" height="29" rx="4" transform="rotate(45 16 135)" />
