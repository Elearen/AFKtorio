openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: launch-rankings
    description: Opt-in rocket launch rankings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /launch-rankings:
    get:
      operationId: previewLaunchRanking
      tags: [launch-rankings]
      summary: Preview a launch result without submitting it
      description: Calculates a relative launch ranking without saving the result.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: timeTakenSeconds
          in: query
          required: true
          schema:
            type: number
            minimum: 0
        - name: totalItemsProduced
          in: query
          required: true
          schema:
            type: number
            minimum: 0
        - name: totalSciencePacksProduced
          in: query
          required: true
          schema:
            type: number
            minimum: 0
        - name: totalIronCopperMined
          in: query
          required: true
          schema:
            type: number
            minimum: 0
      responses:
        "200":
          description: Preview launch ranking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchRankingSubmission"
        "400":
          description: Invalid launch ranking data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: submitLaunchRanking
      tags: [launch-rankings]
      summary: Submit a completed rocket launch for ranking
      description: Saves a launch result once per session ID and returns its ranking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchRankingInput"
      responses:
        "200":
          description: Launch ranking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchRankingSubmission"
        "400":
          description: Invalid launch ranking data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Could not save launch ranking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LaunchRankingInput:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
        timeTakenSeconds:
          type: number
          minimum: 0
        totalItemsProduced:
          type: number
          minimum: 0
        totalSciencePacksProduced:
          type: number
          minimum: 0
        totalIronCopperMined:
          type: number
          minimum: 0
      required:
        - sessionId
        - timeTakenSeconds
        - totalItemsProduced
        - totalSciencePacksProduced
        - totalIronCopperMined
    LaunchRankingSubmission:
      allOf:
        - $ref: "#/components/schemas/LaunchRankingInput"
        - type: object
          properties:
            rank:
              type: number
              minimum: 1
            totalSubmissions:
              type: number
              minimum: 1
            alreadySubmitted:
              type: boolean
            records:
              type: array
              items:
                $ref: "#/components/schemas/LaunchRankingRecord"
          required:
            - rank
            - totalSubmissions
            - alreadySubmitted
            - records
    LaunchRankingRecord:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
        timeTakenSeconds:
          type: number
          minimum: 0
        totalItemsProduced:
          type: number
          minimum: 0
        totalSciencePacksProduced:
          type: number
          minimum: 0
        totalIronCopperMined:
          type: number
          minimum: 0
      required:
        - sessionId
        - timeTakenSeconds
        - totalItemsProduced
        - totalSciencePacksProduced
        - totalIronCopperMined
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

